# Isola banco dos testes do arquivo dev (./data/sindico) para Flyway aplicar do zero
spring:
  datasource:
    url: jdbc:h2:mem:sindico_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

app:
  security:
    enforce-bearer: false
    rate-limit:
      # Testes de slice compartilham contexto/IP; o limitador tem testes proprios.
      enabled: false
  condominio:
    default-id: "00000000-0000-0000-0000-000000000001"

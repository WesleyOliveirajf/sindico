name: sindico

# Somente o back-end. Banco continua no Supabase.
# HTTPS e roteamento: Traefik ja existente na VPS (rede n8n_default, resolver mytlschallenge).
services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: supabase
      DB_URL: ${DB_URL:?defina DB_URL no .env}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?defina APP_JWT_SECRET no .env}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_STORAGE_PROVIDER: ${APP_STORAGE_PROVIDER:-local}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-anexos}
      # Atras do Traefik: "native" (Tomcat RemoteIpValve) resolve o IP real do cliente
      # (rate limit e IP do aceite LGPD) alem de scheme/host. Confia so em proxies de rede interna.
      SERVER_FORWARD_HEADERS_STRATEGY: native
      # A VPS e compartilhada com outros servicos: limita o heap.
      JAVA_TOOL_OPTIONS: -Xmx512m
    volumes:
      - uploads:/app/uploads
    mem_limit: 900m
    networks:
      - traefik
      - saida_v6
    labels:
      traefik.enable: "true"
      traefik.docker.network: n8n_default
      traefik.http.routers.sindico.rule: Host(`${DOMAIN:?defina DOMAIN no .env}`)
      traefik.http.routers.sindico.entrypoints: websecure
      traefik.http.routers.sindico.tls: "true"
      traefik.http.routers.sindico.tls.certresolver: mytlschallenge
      traefik.http.services.sindico.loadbalancer.server.port: "8080"

volumes:
  uploads:

networks:
  traefik:
    name: n8n_default
    external: true
  # Supabase (conexao direta) so responde por IPv6; a rede padrao do Docker nao tem IPv6.
  saida_v6:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:5:1c0::/64
